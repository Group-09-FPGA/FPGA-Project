name: Full-System FPGA Implementation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  routed-build:
    name: Vivado post-route timing and bitstream
    # Vivado is licensed software and is not installed on GitHub-hosted runners.
    # This runner must have Vivado 2026.1 and the RV32IM GNU toolchain.
    runs-on: [self-hosted, linux, x64, vivado-2026.1]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verify firmware image matches source
        run: |
          python3 software/baremetal/lob_test/build_firmware.py
          git diff --exit-code -- software/baremetal/lob_test/imem.hex

      - name: Build and enforce routed timing
        env:
          FPGA_BUILD_DIR: ${{ runner.temp }}/fpga-lob-build
        run: |
          vivado -mode batch -source vivado/scripts/build_system_bitstream.tcl
          test -s "$FPGA_BUILD_DIR/top_system.bit"
          test -s "$FPGA_BUILD_DIR/post_route_timing.rpt"
          test -s "$FPGA_BUILD_DIR/post_route_drc.rpt"

      - name: Upload routed candidate and reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-lob-routed-candidate
          path: |
            ${{ runner.temp }}/fpga-lob-build/top_system.bit
            ${{ runner.temp }}/fpga-lob-build/post_route_timing.rpt
            ${{ runner.temp }}/fpga-lob-build/post_route_drc.rpt
            ${{ runner.temp }}/fpga-lob-build/post_route_utilization.rpt
          retention-days: 14
