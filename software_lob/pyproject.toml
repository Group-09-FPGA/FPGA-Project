[project]
name = "lob-sim"
version = "0.1.0"
description = "Deterministic Python Limit Order Book (LOB) Simulator and FPGA Reference Model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7.0",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
]

[project.scripts]
lob-sim = "lob_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
